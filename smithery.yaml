# Smithery.ai MCP Server Registry manifest
# https://smithery.ai
#
# This file tells Smithery how to start the RTBrick MCP Server.

startCommand:
  type: stdio

  # JSON Schema describing optional user-facing configuration.
  # All fields are optional — the server runs with sensible defaults.
  configSchema:
    type: object
    properties:
      max_versions:
        type: integer
        title: Release lines
        description: How many recent RBFS release lines to offer (newest patch of each).
        minimum: 1
        default: 5
      log_level:
        type: string
        title: Log Level
        description: Logging verbosity sent to stderr (DEBUG, INFO, WARNING, ERROR).
        enum: [DEBUG, INFO, WARNING, ERROR]
        default: INFO
    required: []
    additionalProperties: false

  # Function that returns the stdio command to launch the server.
  commandFunction: |-
    (config) => {
      const env = {};
      if (config.max_versions) {
        env["RTBRICK_MCP_MAX_VERSIONS"] = String(config.max_versions);
      }
      if (config.log_level) {
        env["RTBRICK_MCP_LOG_LEVEL"] = config.log_level;
      }
      return {
        command: "python3",
        args: ["-m", "rtbrick_mcp_server"],
        env
      };
    }
