[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtbrick-mcp-server"
version = "3.0.0"
description = "MCP server for RTBrick RBFS technical documentation and training material"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Pravin Bhandarkar", email = "pravin@rtbrick.com" }
]
maintainers = [
    { name = "Pravin Bhandarkar", email = "pravin@rtbrick.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "rtbrick",
    "rbfs",
    "networking",
    "routing",
    "documentation",
    "claude",
    "ai",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Networking",
    "Topic :: Documentation",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.31",
    "urllib3>=1.26",  # Retry(allowed_methods=...)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage      = "https://www.rtbrick.com"
Documentation = "https://www.rtbrick.com/docs/techdocs/current/index.html"
Repository    = "https://github.com/rtbrick/rtb-mcp"
"Bug Tracker" = "https://github.com/rtbrick/rtb-mcp/issues"
Changelog     = "https://github.com/rtbrick/rtb-mcp/blob/main/CHANGELOG.md"

[project.scripts]
rtbrick-mcp-server = "rtbrick_mcp_server.server:main"
rtb-mcp = "rtbrick_mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rtbrick_mcp_server*"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
